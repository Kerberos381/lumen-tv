name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Lumen-0.1.${{ github.run_number }}.apk"
          sha256sum "Lumen-0.1.${{ github.run_number }}.apk" | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-0.1.${{ github.run_number }}
          path: |
            Lumen-*.apk
            SHA256.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lumen 0.1.${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Install over the previous version to keep your layout.
          files: |
            Lumen-*.apk
            SHA256.txt
          make_latest: true
